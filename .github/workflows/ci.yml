name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Void types (.void/)
        run: |
          (cd apps/api && bunx void prepare)
          (cd apps/admin && bunx void prepare)
          (cd apps/website && bunx void prepare)

      - name: Check (format, lint, type)
        run: bunx vp check

      - name: Test
        run: bunx vp test
