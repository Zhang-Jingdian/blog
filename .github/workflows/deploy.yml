name: Deploy

# Deploys to Cloudflare from CI.
#
# `.void/project.json` (which records the deployment platform) is gitignored, so
# a fresh checkout has no saved destination and Void stops asking to link the
# existing Worker. Passing `--platform cloudflare` explicitly avoids that.
#
# The website is a static (SSG) build that fetches posts from the API, so it has
# to be rebuilt for posts published in the admin to appear.
on:
  # Manual run from the Actions tab.
  workflow_dispatch:
  # Periodic rebuild of the website.
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]

# Never run two deploys at once.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Not a secret — already recorded in apps/api/void.lock.json; pins the account.
  CLOUDFLARE_ACCOUNT_ID: cb730829cc14c443d8be0b6d311ded9a

jobs:
  api:
    # Scheduled runs only refresh the website; API code changes arrive via push.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy API
        working-directory: apps/api
        run: pnpm exec void deploy --platform cloudflare

  website:
    # Run after the API, including when it was skipped (scheduled runs).
    needs: api
    if: always() && !cancelled() && (needs.api.result == 'success' || needs.api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy website
        working-directory: apps/website
        env:
          # Build-time API origin the SSG fetches posts from (repository variable).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm exec void deploy --platform cloudflare
