name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: Which app(s) to deploy
        type: choice
        required: true
        default: all
        options: [all, api, admin, website]

# One deploy at a time (avoids racing D1 migrations / lock files).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Void types (.void/)
        run: |
          (cd apps/api && bunx void prepare)
          (cd apps/admin && bunx void prepare)
          (cd apps/website && bunx void prepare)

      - name: Check (format, lint, type)
        run: bunx vp check

      # API is deployed first so the website build (next) fetches the freshest posts.
      - name: Deploy API
        if: github.event_name == 'push' || inputs.app == 'all' || inputs.app == 'api'
        working-directory: apps/api
        run: bunx void deploy --platform cloudflare

      - name: Deploy admin
        if: github.event_name == 'push' || inputs.app == 'all' || inputs.app == 'admin'
        working-directory: apps/admin
        run: bunx vp build && bunx void deploy --dir dist --spa --platform cloudflare

      - name: Deploy website
        if: github.event_name == 'push' || inputs.app == 'all' || inputs.app == 'website'
        working-directory: apps/website
        run: bunx astro build && bunx void deploy --dir dist --platform cloudflare
